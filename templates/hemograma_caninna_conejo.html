<!-- Generated form content -->
<h1 class="title">RESULTADOS DE LABORATORIO<br />HEMOGRAMA COMPLETO</h1>
<div id="formularioHemograma_caninna" class="form">
  <fieldset class="fieldset">
    <legend class="legend">Fórmula Blanca</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="wbc">WBC: Leucocitos:</label>
        <input class="input-number" type="number" step="any" id="wbc" required />
      </div>
    </div>
    <fieldset class="fieldset nested-fieldset">
      <legend class="legend">Valores Absolutos</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="het_abs">HET: Heterófilos:</label>
        <input class="input-number" type="number" step="any" id="het_abs" required />
        <label class="label" for="lym_abs">LYM: Linfocitos:</label>
        <input class="input-number" type="number" step="any" id="lym_abs" required />
      </div>
      <div class="form-column">
        <label class="label" for="mon_abs">MON: Monocitos:</label>
        <input class="input-number" type="number" step="any" id="mon_abs" required />
        <label class="label" for="bas_abs">BAS: Basófilos:</label>
        <input class="input-number" type="number" step="any" id="bas_abs" required />
      </div>
    </div>
    </fieldset>
    <fieldset class="fieldset nested-fieldset">
      <legend class="legend">Valores Relativos</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="het_rel">HET%: Heterófilos %:</label>
        <input class="input-number" type="number" step="any" id="het_rel" required />
        <label class="label" for="lym_rel">LYM%: Linfocitos %:</label>
        <input class="input-number" type="number" step="any" id="lym_rel" required />
      </div>
      <div class="form-column">
        <label class="label" for="mon_rel">MON%: Monocitos %:</label>
        <input class="input-number" type="number" step="any" id="mon_rel" required />
        <label class="label" for="bas_rel">BAS%: Basófilos %:</label>
        <input class="input-number" type="number" step="any" id="bas_rel" required />
      </div>
    </div>
    </fieldset>
  </fieldset>
  <fieldset class="fieldset">
    <legend class="legend">Fórmula Roja</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="rbc">RBC: Hematíes:</label>
        <input class="input-number" type="number" step="any" id="rbc" required />
        <label class="label" for="hgb">HGB: Hemoglobina:</label>
        <input class="input-number" type="number" step="any" id="hgb" required />
      </div>
      <div class="form-column">
        <label class="label" for="hct">HCT: Hematocrito:</label>
        <input class="input-number" type="number" step="any" id="hct" required />
        <label class="label" for="mcv">MCV:</label>
        <input class="input-number" type="number" step="any" id="mcv" required />
      </div>
      <div class="form-column">
        <label class="label" for="mch">MCH:</label>
        <input class="input-number" type="number" step="any" id="mch" required />
        <label class="label" for="mchc">MCHC:</label>
        <input class="input-number" type="number" step="any" id="mchc" required />
      </div>
    </div>
    <fieldset class="fieldset nested-fieldset">
      <legend class="legend">Índices de Distribución</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="rdw_sd">RDW-SD: Distribución eritrocitaria:</label>
        <input class="input-number" type="number" step="any" id="rdw_sd" required />
        <label class="label" for="rdw_cv">RDW-CV: Distribución eritrocitaria:</label>
        <input class="input-number" type="number" step="any" id="rdw_cv" required />
      </div>
      <div class="form-column">
        <label class="label" for="hdw_sd">HDW-SD: Distribución Hb eritrocitaria:</label>
        <input class="input-number" type="number" step="any" id="hdw_sd" required />
        <label class="label" for="hdw_cv">HDW-CV: Distribución Hb eritrocitaria:</label>
        <input class="input-number" type="number" step="any" id="hdw_cv" required />
      </div>
    </div>
    </fieldset>
    <fieldset class="fieldset nested-fieldset">
      <legend class="legend">Morfología Eritrocitaria</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="ret_abs">RET: Reticulocitos:</label>
        <input class="input-number" type="number" step="any" id="ret_abs" required />
        <label class="label" for="ret_rel">RET%: Reticulocitos %:</label>
        <input class="input-number" type="number" step="any" id="ret_rel" required />
        <label class="label" for="nrbc_abs">NRBC: Hematíes nucleados:</label>
        <input class="input-number" type="number" step="any" id="nrbc_abs" required />
      </div>
      <div class="form-column">
        <label class="label" for="nrbc_wbc_rel">NRBC/WBC%: Hematíes nucleados %:</label>
        <input class="input-number" type="number" step="any" id="nrbc_wbc_rel" required />
        <label class="label" for="etg_abs">ETG: Hematíes fantasma:</label>
        <input class="input-number" type="number" step="any" id="etg_abs" required />
        <label class="label" for="etg_rel">ETG%: Hematíes fantasma %:</label>
        <input class="input-number" type="number" step="any" id="etg_rel" required />
      </div>
      <div class="form-column">
        <label class="label" for="sph_abs">SPH: Esferocitos:</label>
        <input class="input-number" type="number" step="any" id="sph_abs" required />
        <label class="label" for="sph_rel">SPH%: Esferocitos %:</label>
        <input class="input-number" type="number" step="any" id="sph_rel" required />
        <label class="label" for="agg_abs">AGG: Agregados de hematíes:</label>
        <input class="input-number" type="number" step="any" id="agg_abs" required />
      </div>
    </div>
    </fieldset>
  </fieldset>
  <fieldset class="fieldset">
    <legend class="legend">Plaquetas</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="eplt">EPLT: Recuento total de plaquetas:</label>
        <input class="input-number" type="number" step="any" id="eplt" required />
        <label class="label" for="plt_abs">PLT: Recuento absoluto de plaquetas:</label>
        <input class="input-number" type="number" step="any" id="plt_abs" required />
      </div>
      <div class="form-column">
        <label class="label" for="aplt_abs">APLT: Agregados de plaquetas:</label>
        <input class="input-number" type="number" step="any" id="aplt_abs" required />
        <label class="label" for="pct">PCT: Plaquetocrito:</label>
        <input class="input-number" type="number" step="any" id="pct" required />
      </div>
      <div class="form-column">
        <label class="label" for="mpv">MPV:</label>
        <input class="input-number" type="number" step="any" id="mpv" required />
      </div>
    </div>
    <fieldset class="fieldset nested-fieldset">
      <legend class="legend">Índices Plaquetarios</legend>
    <div class="form-columns">
      <div class="form-column">
        <label class="label" for="lplt_abs">LPLT: Plaquetas grandes:</label>
        <input class="input-number" type="number" step="any" id="lplt_abs" required />
        <label class="label" for="lplt_eplt">LPLT/EPLT: Ratio plaquetas grandes:</label>
        <input class="input-number" type="number" step="any" id="lplt_eplt" required />
      </div>
      <div class="form-column">
        <label class="label" for="pdw_sd">PDW-SD: Distribución plaquetaria:</label>
        <input class="input-number" type="number" step="any" id="pdw_sd" required />
        <label class="label" for="pdw_cv">PDW-CV: Distribución plaquetaria:</label>
        <input class="input-number" type="number" step="any" id="pdw_cv" required />
      </div>
    </div>
    </fieldset>
  </fieldset>
</div>
